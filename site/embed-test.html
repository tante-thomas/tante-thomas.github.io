<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Embed test</title>
  <style>
    body {
      margin: 0 auto;
      max-width: 40rem;
      padding: 1rem;
      background: #0b0b0d;
      color: #f2f2f2;
      font-family: system-ui, sans-serif;
    }
    iframe { width: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- Throwaway page for the open decision "Which player is embedded" in docs/brief.md.
       Removed once the decision is made. -->
  <h1>Embed test</h1>
  <p>Open this page on a phone without being logged in. For each player: does a mix start, can you skip ahead, does an ad play first?</p>

  <h2>SoundCloud</h2>
  <!-- The profile embed lists the newest uploads, so it needs no change when a mix is added.
       The user ID comes from SoundCloud's oEmbed answer for soundcloud.com/tantethomas. -->
  <iframe height="450" allow="autoplay; encrypted-media"
    src="https://w.soundcloud.com/player/?visual=true&url=https%3A%2F%2Fapi.soundcloud.com%2Fusers%2F46170096&show_artwork=true"></iframe>

  <h2>Mixcloud</h2>
  <p id="mixcloud-status">Loading the latest mix …</p>
  <iframe id="mixcloud-player" height="120" allow="autoplay" hidden></iframe>

  <script>
    // Mixcloud's widget plays one mix, not a profile, so the newest mix is looked up
    // in Mixcloud's public API on every visit. The API allows requests from any site.
    const MIXCLOUD_LATEST_MIX = "https://api.mixcloud.com/TanteThomas/cloudcasts/?limit=1";
    const MIXCLOUD_WIDGET = "https://player-widget.mixcloud.com/widget/iframe/?hide_cover=1&feed=";

    async function showLatestMixcloudMix() {
      const status = document.getElementById("mixcloud-status");
      const player = document.getElementById("mixcloud-player");
      try {
        const response = await fetch(MIXCLOUD_LATEST_MIX);
        const latestMix = (await response.json()).data[0];
        player.src = MIXCLOUD_WIDGET + encodeURIComponent(latestMix.key);
        player.hidden = false;
        status.textContent = latestMix.name;
      } catch (error) {
        status.textContent = "Could not load the latest mix: " + error;
      }
    }

    showLatestMixcloudMix();
  </script>
</body>
</html>

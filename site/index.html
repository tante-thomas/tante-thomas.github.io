<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DJ TANTE THOMAS. Music for body and soul. Mixes, gigs and booking.">
  <meta name="color-scheme" content="dark">
  <title>TANTE THOMAS</title>
  <link rel="stylesheet" href="style.css">
  <script src="gigs.js" defer></script>
</head>
<body>
  <main>
    <header class="hero">
      <h1 class="wordmark">TANTE THOMAS</h1>
      <p class="genre">Music for body and soul.</p>
      <ul class="links">
        <li><a href="https://soundcloud.com/tantethomas">SoundCloud</a></li>
        <li><a href="https://www.mixcloud.com/TanteThomas/">Mixcloud</a></li>
        <li><a href="https://www.instagram.com/tante.thomas.dj/">Instagram</a></li>
      </ul>
    </header>

    <section aria-labelledby="mixes-heading">
      <h2 id="mixes-heading">Mixes</h2>
      <!-- The profile player lists the newest uploads, so a new mix needs no change here.
           46170096 is the user ID of soundcloud.com/tantethomas, from SoundCloud's oEmbed answer. -->
      <iframe class="player" title="TANTE THOMAS on SoundCloud" loading="lazy" allow="autoplay; encrypted-media"
        src="https://w.soundcloud.com/player/?visual=true&url=https%3A%2F%2Fapi.soundcloud.com%2Fusers%2F46170096&show_artwork=true"></iframe>
    </section>

    <section aria-labelledby="gigs-heading">
      <h2 id="gigs-heading">Upcoming gigs</h2>
      <!-- Filled by gigs.js from gigs.csv. -->
      <ul id="gig-list"></ul>
      <p id="gig-status" aria-live="polite">Loading gigs …</p>
    </section>

    <section class="booking" aria-labelledby="booking-heading">
      <h2 id="booking-heading">Booking</h2>
      <p>For bookings and enquiries, write an email.</p>
      <a class="button" href="mailto:thomaswening94@gmail.com?subject=Booking%20request">Booking request</a>
    </section>
  </main>

  <footer>TANTE THOMAS</footer>
</body>
</html>
